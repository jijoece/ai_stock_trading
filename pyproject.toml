[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research"
version = "0.1.0"
description = "Local-first, read-only research pipeline for AI-driven stock research architecture investigation (no live trading)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "mcp>=1.28.1",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Milestone 3: LumiBot paper-execution runtime adapter, isolated behind
# src/trading_research/runtime/lumibot/ (see docs/milestone3-lumibot-paper-integration.md).
# Deliberately NOT a base dependency: lumibot pulls ~140 transitive packages
# unrelated to this project (langchain, google-adk, kubernetes client,
# openai, ...) and its own pins downgrade jsonschema/python-dotenv below the
# floor declared above. Install in an isolated environment; the full test
# suite never requires this extra (lumibot-specific tests use
# pytest.importorskip).
paper = [
    "lumibot==4.5.74",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "paper_broker: opt-in real credentialed paper-broker smoke test (Milestone 4) — requires RUN_PAPER_BROKER_TESTS=true and real Alpaca paper credentials; skipped by default, never run automatically just because credentials happen to be present.",
    "claude_api: opt-in real Claude API structured-output smoke test (Milestone 5) — requires RUN_CLAUDE_RESEARCH_TESTS=true and a real ANTHROPIC_API_KEY plus research.model configured; skipped by default, never run automatically just because credentials happen to be present.",
    "sec_api: opt-in real SEC EDGAR smoke test (Milestone 6) — requires RUN_SEC_API_TESTS=true; skipped by default. No credentials are required by SEC EDGAR itself, but this still never runs automatically.",
    "market_data_api: opt-in real Alpaca market-data smoke test (Milestone 6) — requires RUN_MARKET_DATA_TESTS=true and real Alpaca credentials; skipped by default, never run automatically just because credentials happen to be present.",
    "news_api: opt-in real news-provider smoke test (Milestone 6) — requires RUN_NEWS_API_TESTS=true and a real news-provider API key; skipped by default.",
    "real_research_cycle: opt-in real scheduled-research-cycle smoke test (Milestone 6) — requires RUN_REAL_RESEARCH_CYCLE=true; skipped by default.",
]
