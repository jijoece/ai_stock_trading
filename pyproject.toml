[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research"
version = "0.1.0"
description = "Local-first, read-only research pipeline for AI-driven stock research architecture investigation (no live trading)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.116.0",
    "mcp>=1.28.1",
    "jsonschema>=4.26.0",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
