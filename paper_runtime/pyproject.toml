[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-paper-runtime"
version = "0.1.0"
description = "Isolated LumiBot/Alpaca paper-broker runtime process. Speaks paper-runtime.v2 JSON Lines over stdin/stdout to the main trading-desk process; never imported by it."
requires-python = ">=3.10"
dependencies = [
    "lumibot==4.5.74",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    "**/*.egg-info",
    ".pytest_cache",
]
venvPath = ".."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
