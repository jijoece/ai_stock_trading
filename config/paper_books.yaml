# Isolated paper-book configuration (Milestone 8, docs/milestone-8.md Step 3).
#
# Shipped fully disabled: `paper_books.enabled: false` and the enhanced book's
# own `enabled: false`. No environment variable can flip any of these — same
# "credentials never decide a capability" convention as
# `shadow_operations.yaml`/`evidence_providers.yaml`. `execution.allow_live_broker`
# is structurally impossible to be `true` (config loading raises immediately),
# mirroring `shadow/config.py`'s `allow_enhanced_submission` pattern — there is
# no way to reach live execution from this file. All money/percentage values
# are quoted strings parsed as Decimal so they round-trip exactly.
version: 1

paper_books:
  enabled: false

  books:
    baseline:
      enabled: true
      book_id: BASELINE
      starting_cash_usd: "100000.00"

    enhanced:
      enabled: false
      book_id: ENHANCED
      starting_cash_usd: "100000.00"

  execution:
    provider: local_simulated       # local_simulated | external_paper_broker — unknown values fail closed
    allow_external_paper_broker: false
    allow_live_broker: false        # cannot be set true — config load fails closed

  risk:
    max_position_weight: "0.10"
    max_order_notional_usd: "1000.00"
    max_daily_new_notional_usd: "5000.00"
    minimum_cash_buffer_weight: "0.10"
    max_open_positions: 20
    max_symbol_concentration_weight: "0.10"
    reject_stale_market_price_seconds: 900

  valuation:
    price_source: evidence_snapshot        # evidence_snapshot | persisted_market_bar — unknown values fail closed
    maximum_price_age_seconds: 900
    missing_price_policy: MARK_UNVALUED     # MARK_UNVALUED is the only supported policy — fails closed otherwise
