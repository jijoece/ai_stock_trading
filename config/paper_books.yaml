# Isolated paper-book configuration (Milestone 8, docs/milestone-8.md Step 3).
#
# Shipped fully disabled: `paper_books.enabled: false` and the enhanced book's
# own `enabled: false`. No environment variable can flip any of these — same
# "credentials never decide a capability" convention as
# `shadow_operations.yaml`/`evidence_providers.yaml`. `execution.allow_live_broker`
# is structurally impossible to be `true` (config loading raises immediately),
# mirroring `shadow/config.py`'s `allow_enhanced_submission` pattern — there is
# no way to reach live execution from this file. All money/percentage values
# are quoted strings parsed as Decimal so they round-trip exactly.
version: 1

paper_books:
  enabled: false

  # Milestone 8.1: gates the real-scheduled-cycle integration path
  # (`paper-book-integrate-cycle` / `scheduled_integration.py`) separately
  # from the fixture-mode `paper-book-run-cycle` command above, which is
  # only gated by `paper_books.enabled`. Both this flag AND
  # `paper_books.enabled` must be true for the scheduled path to run.
  scheduled_integration:
    enabled: false

  # Milestone 9.3: manual multi-day campaign runner. This cannot be enabled
  # by an environment variable and never installs a recurring schedule.
  soak_campaign:
    enabled: false
    minimum_market_days: 5
    minimum_completed_cycles: 10
    minimum_successful_real_provider_cycles: 5
    maximum_unresolved_warnings: 0
    stop_on_blocker: true

  # Milestone 10: local simulated recurring paper lifecycle. Configuration
  # is only one gate: an immutable ready review, activation request, and
  # separate explicit activation event are also required.
  recurring:
    enabled: false
    schedule:
      timezone: America/Los_Angeles
      market_days_only: true
      hour: 13
      minute: 30
    maximum_cycles_per_run: 5
    maximum_runtime_seconds: 900
    lease_ttl_seconds: 1200
    activation_review_max_age_market_days: 10
    pause_on_safety_block: true

  books:
    baseline:
      enabled: true
      book_id: BASELINE
      starting_cash_usd: "100000.00"

    enhanced:
      enabled: false
      book_id: ENHANCED
      starting_cash_usd: "100000.00"

  execution:
    provider: local_simulated       # local_simulated | external_paper_broker — unknown values fail closed
    allow_external_paper_broker: false
    allow_live_broker: false        # cannot be set true — config load fails closed

  # Milestone 11: optional manual Alpaca paper-account boundary. These gates
  # are independent of credentials and of the local recurring scheduler.
  # A single runtime credential set may serve at most one enabled book.
  external_broker:
    enabled: false
    provider: alpaca_paper
    allow_order_submission: false
    enabled_book_ids: []
    require_explicit_preview: true
    require_recent_preview_seconds: 300
    maximum_order_notional_usd: "50.00"
    permitted_order_types:
      - limit
    permitted_time_in_force:
      - day
    maximum_retry_attempts: 1

  risk:
    max_position_weight: "0.10"
    max_order_notional_usd: "1000.00"
    max_daily_new_notional_usd: "5000.00"
    minimum_cash_buffer_weight: "0.10"
    max_open_positions: 20
    max_symbol_concentration_weight: "0.10"
    reject_stale_market_price_seconds: 900
    max_daily_loss_fraction: "0.03"
    max_drawdown_fraction: "0.15"
    daily_loss_action: PAUSE_NEW_ENTRIES
    drawdown_action: PAUSE_NEW_ENTRIES
    require_reconciled_risk_state: true
    maximum_risk_state_age_seconds: 900

  valuation:
    price_source: evidence_snapshot        # evidence_snapshot | persisted_market_bar — unknown values fail closed
    maximum_price_age_seconds: 900
    missing_price_policy: MARK_UNVALUED     # MARK_UNVALUED is the only supported policy — fails closed otherwise

  # Milestone 9: manual, disabled-by-default daily lifecycle processing
  # (pending-order resolution + deterministic exits + soak reporting). No
  # environment variable can enable this section — only this file can, and
  # `paper_books/lifecycle.py::run_paper_book_lifecycle` is manually invoked
  # only (never launchd, never a recurring scheduler).
  lifecycle:
    enabled: false

    pending_orders:
      expire_after_market_days: 1

    exits:
      enabled: false
      stop_loss_percent: "0.08"
      profit_target_percent: "0.15"
      maximum_holding_market_days: 20
      exit_on_recommendation_reversal: true

    # Milestone 13 controls are dormant until lifecycle and the individual
    # feature gate are both enabled. Python computes every value.
    atr:
      enabled: false
      period: 14
      initial_stop_multiple: "2.0"
      initial_target_multiple: "3.0"
      minimum_atr_percent: "0.005"
      maximum_atr_percent: "0.20"

    trailing_stop:
      enabled: false
      activation_r_multiple: "1.5"
      atr_multiple: "2.0"
      never_loosen_stop: true

    breakeven:
      enabled: false
      activation_r_multiple: "1.0"
      offset_bps: "0"
      never_loosen_stop: true

    partial_profit:
      enabled: false
      stages:
        - stage: 1
          trigger_r_multiple: "1.5"
          close_fraction: "0.50"
        - stage: 2
          trigger_r_multiple: "2.5"
          close_fraction: "0.25"
      minimum_remaining_quantity: "1"

    economic_event_blackout:
      enabled: false
      before_minutes: 30
      after_minutes: 30
      minimum_importance: HIGH
      markets:
        - US
      blocked_categories:
        - FOMC
        - CPI
        - PPI
        - NONFARM_PAYROLLS
        - GDP
        - RETAIL_SALES
        - UNEMPLOYMENT
      unknown_event_state_action: BLOCK_NEW_ENTRIES
      maximum_data_age_minutes: 1440

    soak:
      minimum_completed_cycles: 10
      minimum_market_days: 5
