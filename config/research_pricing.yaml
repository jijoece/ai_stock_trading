# Optional, effective-dated Anthropic pricing configuration
# (Milestone 5, docs/milestone-5.md Step 3/17).
#
# Deliberately empty by default: this repository does not hardcode model
# pricing as timeless truth. When no entry matches (provider, model,
# effective_date <= usage date), `research/usage.py::build_usage_record`
# sets cost_status=PRICING_NOT_CONFIGURED and leaves estimated_cost unset —
# token usage is still persisted, just not priced.
#
# To enable cost estimation, add dated entries such as:
#
# pricing:
#   - provider: anthropic
#     model: claude-sonnet-5
#     effective_date: "2026-01-01"
#     currency: USD
#     input_price_per_million: "3.00"
#     output_price_per_million: "15.00"
#     pricing_version: anthropic-2026-01-01
version: 1
pricing:
  # Conservative API-equivalent estimate for the mutable Claude Code
  # `sonnet` alias. Every usage row also persists the resolved model ID, so
  # this estimate is never represented as authoritative subscription billing.
  - provider: claude_code
    model: sonnet
    effective_date: "2026-07-17"
    currency: USD
    input_price_per_million: "3.00"
    output_price_per_million: "15.00"
    pricing_version: claude-code-sonnet-api-equivalent-2026-07-17
  # Conservative API-equivalent estimate for the Codex CLI's ChatGPT-plan
  # authentication. Every usage row also persists the CLI version, so this
  # estimate is never represented as the user's actual ChatGPT subscription
  # charge.
  - provider: codex
    model: gpt-5.1-codex
    effective_date: "2026-07-18"
    currency: USD
    input_price_per_million: "1.25"
    output_price_per_million: "10.00"
    pricing_version: codex-gpt-5.1-codex-api-equivalent-2026-07-18
