# Claude research-layer configuration (Milestone 5, docs/milestone-5.md Step 18).
#
# Research defaults to DISABLED. Presence of ANTHROPIC_API_KEY in the
# environment never flips `enabled` or selects a provider by itself — that
# would violate "no fallback model provider may be selected silently"
# (docs/milestone-5.md Step 3/18). Flipping `enabled: true` and setting
# `provider: anthropic` plus an explicit `model` are both required before any
# real Claude call can happen; `research/configuration.py::require_ready`
# additionally fails closed if provider=anthropic and model is still unset.
version: 1

research:
  enabled: false
  provider: deterministic       # deterministic | scripted | anthropic | claude_code | codex
  model: null                   # use `sonnet` explicitly for provider: claude_code; an explicit
                                 # Codex model id (e.g. the configured chat model) for provider: codex
  max_attempts_per_role: 2
  request_timeout_seconds: 60
  max_input_characters: 100000
  max_evidence_items: 100
  max_items_per_source_category: 25
  max_claims_per_role: 20
  max_output_tokens: 4000
  require_point_in_time_safe: true
  require_evidence_for_material_claims: true
  fail_on_stale_required_evidence: true
  allow_parallel_roles: false

# Safe inactive Claude Code defaults. Selecting this provider still requires
# research.provider=claude_code and research.model=sonnet; credentials never
# activate it. The operator should replace working_directory with a private
# 0700 runtime directory outside the repository.
claude_code:
  binary_path: /opt/homebrew/bin/claude
  minimum_version: "2.1.205"
  terminate_grace_seconds: 5
  maximum_stdout_bytes: 1048576
  maximum_stderr_bytes: 65536
  maximum_schema_bytes: 262144
  maximum_prompt_bytes: 524288
  maximum_budget_usd_per_call: "0.50"
  maximum_turns: 1
  working_directory: /private/tmp/agentic-trading-desk-claude-code
  require_oauth_authentication: true
  require_usage_metadata: true

# Safe inactive Codex defaults. Selecting this provider still requires
# research.provider=codex and an explicit research.model; credentials never
# activate it. The operator should replace working_directory with a private
# 0700 runtime directory outside the repository.
codex:
  binary_path: /opt/homebrew/bin/codex
  minimum_version: "0.144.5"
  terminate_grace_seconds: 5
  maximum_stdout_bytes: 1048576
  maximum_stderr_bytes: 65536
  maximum_jsonl_line_bytes: 262144
  maximum_jsonl_events: 10000
  maximum_schema_bytes: 262144
  maximum_prompt_bytes: 524288
  working_directory: /private/tmp/agentic-trading-desk-codex
  require_chatgpt_authentication: true
  require_usage_metadata: true

# First vertical slice role set (docs/milestone-5.md Step 7). Additional
# roles (catalyst, news, sentiment) can be appended once this slice is
# proven — every role name must be one research/configuration.py::KNOWN_ROLES
# recognizes, or config loading fails closed.
roles:
  - fundamental
  - technical
  - bull
  - bear
  - manager

overlay:
  policy_version: research-overlay.v1
  allow_score_increase: false
  allow_position_size_increase: false
  incomplete_action: ANALYSIS_INCOMPLETE
  critical_risk_action: FORCE_NO_ACTION
