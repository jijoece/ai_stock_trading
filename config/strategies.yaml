# Version-controlled deterministic strategy-scanner configuration
# (Milestone 23, B1-B6). Zero LLM calls read or write this file at runtime;
# thresholds are only changed by editing this file.
version: 1

# Activation stage (B9). Deterministic strategy candidate selection is
# disabled by default — enabling it does not submit orders on its own,
# but the flag stays false until the shortlist layer has been reviewed.
#
# activation_stage records progress through the required 7-stage rollout
# (see ACTIVATION_STAGES in strategies/config.py and
# docs/strategy-candidate-selection.md):
#   STAGE_1_OFFLINE_FIXTURES -> STAGE_2_HISTORICAL_BACKTEST ->
#   STAGE_3_DAILY_READ_ONLY_CANDIDATE_LIST ->
#   STAGE_4_SHADOW_RECOMMENDATION_TRACKING -> STAGE_5_LOCAL_PAPER_BOOK ->
#   STAGE_6_SUPERVISED_ALPACA_PAPER -> STAGE_7_MULTI_DAY_PAPER_SOAK
# `enabled` cannot be true while still at stage 1 or 2 (loader-enforced).
strategy_candidate_selection:
  enabled: false
  activation_stage: STAGE_2_HISTORICAL_BACKTEST

momentum_breakout:
  enabled: true
  breakout_lookback_days: 20
  trend_sma_days: 50
  trend_slope_lookback_days: 5
  volume_lookback_days: 20
  minimum_volume_ratio: 1.5
  minimum_relative_strength: 0.0
  maximum_breakout_extension_percent: 3.0
  atr_period: 14
  atr_stop_multiple: 2.0
  maximum_holding_days: 20

mean_reversion:
  enabled: true
  mean_lookback_days: 20
  zscore_entry_threshold: -2.0
  rsi_period: 14
  maximum_entry_rsi: 30.0
  long_trend_sma_days: 200
  require_price_above_long_trend: true
  atr_period: 14
  atr_stop_multiple: 1.5
  maximum_holding_days: 10

event_catalyst:
  enabled: true
  maximum_event_age_hours: 72.0
  minimum_volume_ratio: 1.5
  volume_lookback_days: 20
  maximum_gap_percent: 8.0
  confirmation_window_days: 3
  maximum_holding_days: 15
  minimum_positive_response_percent: 1.0
  atr_period: 14
  atr_stop_multiple: 2.0

shortlist:
  maximum_candidates_per_strategy: 5
  maximum_combined_shortlist: 10
  maximum_symbols_to_research_per_day: 3
  maximum_fresh_research_cycles_per_day: 3
  minimum_signal_strength_for_research: 0.0
  # Milestone 24 Part C6: real per-symbol pre-research filter, replacing the
  # misleading portfolio-exposure<100% gate. A symbol already within
  # minimum_candidate_allocation_fraction of the cap cannot receive any
  # allowed allocation, so it is excluded before it ever consumes a
  # research token. This conservative 8% research prefilter is intentionally
  # below the standing 10% paper-book execution-risk cap; the execution risk
  # gate remains authoritative and this value must never exceed that cap.
  maximum_symbol_allocation_fraction: 0.08
  minimum_candidate_allocation_fraction: 0.01
